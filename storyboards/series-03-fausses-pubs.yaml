  title: Le Silence Premium™
  character: clown
  duration_s: 18
  text_lines:
  - 'Texte : « Fatigué du bruit ? Découvrez le Silence Premium™, le silence en boîte, garanti sans aucun
    son. Une fois ouvert, plus un bruit ! Le Silence Premium™ : 9,99 €. Mode d''emploi : fermez la porte.
    Mentions légales : le silence peut être interrompu par vos voisins. »'
  plans:
  - plan: 1
    duration: 0-4 s
    image: Le personnage se bouche les oreilles au milieu d'une pièce bruyante (mixeur, perceuse, klaxon)
    sound: Vacarme, puis jingle
    subtitle: « Fatigué du bruit ? »
    subtitle_color: white
  - plan: 2
    duration: 4-9 s
    image: 'Packshot : une boîte blanche ornée d''un grand « Silence Premium™ »'
    sound: Voix off enthousiaste
    subtitle: « Le silence en boîte »
    subtitle_color: white
  - plan: 3
    duration: 9-14 s
    image: Il ouvre la boîte, sourit, boit un thé en silence
    sound: Silence complet, puis coup de perceuse au loin
    subtitle: « Garanti sans aucun son »
    subtitle_color: white
  - plan: 4
    duration: 14-18 s
    image: Carton avec le prix ; mention légale en petits caractères
    sound: Silence 1 s, voix rapide pour la mention légale
    subtitle: '« Mode d''emploi : fermez la porte »'
    subtitle_color: white
